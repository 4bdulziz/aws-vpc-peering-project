<text x="1375" y="126" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">✕</text>
<text x="1085" y="249" font-family="'DejaVu Sans',Arial,sans-serif" font-size="11.5" fill="#C0392B" font-weight="normal" text-anchor="start">Controlled failure (author-reported): with this rule removed, App-A pings</text>
