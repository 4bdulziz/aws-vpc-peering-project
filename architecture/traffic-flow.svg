<text x="1504" y="397" font-family="'DejaVu Sans',Arial,sans-serif" font-size="14" fill="#0B1F3A" font-weight="bold" text-anchor="start">App-A receives</text>
<text x="1474" y="424" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#0B1F3A" font-weight="normal" text-anchor="start">echo reply delivered</text>
<text x="1474" y="444" font-family="'DejaVu Sans Mono',monospace" font-size="11.5" fill="#5B6B7F" font-weight="normal" text-anchor="start">ewb-app-a · 10.10.2.10</text>
<text x="40" y="504" font-family="'DejaVu Sans',Arial,sans-serif" font-size="14" fill="#0B1F3A" font-weight="bold" text-anchor="start">Notes</text>
<text x="40" y="526" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#0B1F3A" font-weight="normal" text-anchor="start">• ewb-sg-app-a's rule (All ICMP from 10.20.1.10/32) governs App-B-initiated pings (the B→A test, E03); the reply in the A→B test is covered by stateful tracking.</text>
<text x="40" y="546" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#0B1F3A" font-weight="normal" text-anchor="start">• SSH to App-B: the bastion (10.10.1.10) opens the connection, so ewb-sg-app-b allows TCP 22 from 10.10.1.10/32 and the bastion's subnet needs a 10.20.0.0/16 → pcx route †.</text>
<text x="40" y="566" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#5B6B7F" font-weight="normal" text-anchor="start">† Not visible in supplied screenshots (draft/brief only). The B→A test (E03) runs the same path in the opposite roles: App-B initiates, App-A replies.</text>
</svg>