<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00A8E8"/></marker></defs>
<rect width="1800" height="600" fill="#FFFFFF"/><rect width="1800" height="70" fill="#0B1F3A"/>
<text x="40" y="33" font-family="'DejaVu Sans',Arial,sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="start">Forward and return path — ICMP between App-A and App-B (historical configuration)</text>
<text x="40" y="56" font-family="'DejaVu Sans',Arial,sans-serif" font-size="13.5" fill="#9FD8F5" font-weight="normal" text-anchor="start">Each hop needs a matching route AND a permitting security-group rule. Peering is point-to-point and non-transitive.</text>
<text x="40" y="110" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" fill="#0079B0" font-weight="bold" text-anchor="start">FORWARD  ·  App-A (10.10.2.10) → App-B (10.20.1.10): ICMP echo request</text>
